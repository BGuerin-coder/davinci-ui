name: Build

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: node:22.12.0
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run build
        run: pnpm build
